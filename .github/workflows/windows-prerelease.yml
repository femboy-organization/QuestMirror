name: Build Windows pre-release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-prerelease.yml"
      - "src/**"
      - "dist/index.html"
      - "dist/index.css"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spectra-windows-prerelease
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies and refresh lockfile
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit code $LASTEXITCODE" }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          $lockChanged = $LASTEXITCODE
          if ($lockChanged -eq 1) {
            git commit -m "build: refresh npm lockfile"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit refreshed package-lock.json" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not push refreshed package-lock.json" }
          } elseif ($lockChanged -gt 1) {
            throw "git diff failed while checking package-lock.json"
          }

      - name: Compile TypeScript
        run: npm run build

      - name: Package Windows x64 application
        shell: pwsh
        run: |
          npx --yes @electron/packager@20.3.0 . SPECTRA --platform=win32 --arch=x64 --no-asar --out=artifacts --overwrite
          if ($LASTEXITCODE -ne 0) { throw "Electron packaging failed with exit code $LASTEXITCODE" }

          $appDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\SPECTRA-win32-x64"
          $exePath = Join-Path $appDir "SPECTRA.exe"
          $embedPath = Join-Path $appDir "resources\app\scripts\embed-scrcpy-window.ps1"
          if (-not (Test-Path $exePath)) { throw "Packaged executable was not found: $exePath" }
          if (-not (Test-Path $embedPath)) { throw "The in-app mirroring helper was not packaged: $embedPath" }

          $archive = Join-Path $env:GITHUB_WORKSPACE "SPECTRA-v0.1.0-pre.1-win-x64.zip"
          Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive)) { throw "The release ZIP was not generated." }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Path "$archive.sha256" -Encoding ascii
          Write-Host "Packaged files:"
          Get-ChildItem $appDir | Select-Object Name, Length
          Write-Host "SHA-256: $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-v0.1.0-pre.1-win-x64
          path: |
            SPECTRA-v0.1.0-pre.1-win-x64.zip
            SPECTRA-v0.1.0-pre.1-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this pre-release already exists
        id: release-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0-pre.1 --repo femboy-organization/QuestMirror --json url 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Add-Content $env:GITHUB_OUTPUT
          } else {
            "exists=false" | Add-Content $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub pre-release
        if: steps.release-check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre.1
          target_commitish: main
          name: SPECTRA v0.1.0-pre.1
          prerelease: true
          generate_release_notes: true
          body: |
            ## SPECTRA v0.1.0-pre.1

            First Windows x64 pre-release build.

            - Electron desktop application with the Quest display area embedded in the main window.
            - Windows build includes Electron runtime files and required DLLs.
            - scrcpy and ADB are downloaded into the current user's application data directory on first launch.
            - Includes USB and wireless connection controls, crop settings, FPS/size settings, fullscreen and recording controls.

            This is an early pre-release. Test it with a Meta Quest headset in developer mode and report any device-specific issues.
          files: |
            SPECTRA-v0.1.0-pre.1-win-x64.zip
            SPECTRA-v0.1.0-pre.1-win-x64.zip.sha256
