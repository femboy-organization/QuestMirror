name: Build Simple Magic Mega
on:
  push:
    branches:
      - tmp-simplemagic-mega-build
    paths:
      - 'tmp-simplemagic-mega.trigger'
      - '.github/workflows/tmp-simplemagic-mega.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gradle:8.8-jdk17
    steps:
      - uses: actions/checkout@v4
      - name: Install archive utilities
        run: apt-get update && apt-get install -y xz-utils
      - name: Reassemble and restore source archive
        run: cat tmp-simplemagic-mega.part* | base64 -d | tar -xJf -
      - name: Apply Forge 1.20.1 compile fixes
        working-directory: simplemagic-mega
        run: |
          sed -i 's/e -> e.isAlive() \&\& e != player/e -> e.isAlive()/' src/main/java/com/openai/simplemagic/item/RelicItem.java
          sed -i 's/inventory.getDisplayName()/Component.translatable("container.inventory")/' src/main/java/com/openai/simplemagic/menu/WingSlotScreen.java
      - name: Compile Forge mod
        working-directory: simplemagic-mega
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: simplemagic-mega-2.0.0
          path: simplemagic-mega/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
